name: Deploy full NomotecnIA staging (explicit opt-in)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-nomotecnia-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/feature/document-intelligence-sandbox-20261015' && vars.ENABLE_FULL_STAGING_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: full-staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Full app tests
        run: bunx vitest run src/lib/staging-gate.test.ts
      - name: Build full NomotecnIA with strict staging-only Supabase
        env:
          VITE_NOMOTECNIA_STAGING: "true"
          VITE_ENABLE_DOCUMENT_PDF_LAB: "true"
          VITE_SUPABASE_URL: "https://vknvadzsjuixcuwegxto.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          bun run build
          node scripts/prepare-full-staging.mjs
      - name: Deploy separate full-app staging worker (never nomotecnia-app)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_STAGING_ACCOUNT_ID }}
          FULL_STAGING_PASSWORD: ${{ secrets.FULL_STAGING_PASSWORD }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing Cloudflare staging credentials"
            exit 1
          fi
          if [ "${#FULL_STAGING_PASSWORD}" -lt 18 ]; then
            echo "::error::FULL_STAGING_PASSWORD must be at least 18 characters"
            exit 1
          fi
          bunx wrangler@4 deploy --config .output/server/wrangler.staging.json
          printf '%s' "$FULL_STAGING_PASSWORD" |
            bunx wrangler@4 secret put STAGING_ACCESS_PASSWORD --config .output/server/wrangler.staging.json
