name: Local document operational checks
on:
  push:
    branches: ["feature/document-intelligence-sandbox-20261015"]
    paths:
      - "src/components/DocumentPrefillSandbox*"
      - "src/lib/local-pdf-reader*"
      - "src/lib/local-ocr*"
      - "src/lib/document-archive*"
      - "src/components/DocumentArchive*"
      - "scripts/verify-document-extensions.mjs"
      - "scripts/prepare-ocr-assets.mjs"
      - "package.json"
      - "bun.lock"
      - "src/routes/_authenticated/assessment.$id.tsx"
      - "scripts/verify-staging-ui.mjs"
      - ".github/workflows/test-local-documents.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nomotecnia-staging-ui-disposable
  cancel-in-progress: false
jobs:
  operational:
    if: github.ref == 'refs/heads/feature/document-intelligence-sandbox-20261015'
    runs-on: ubuntu-latest
    environment: staging-rls
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install frozen dependencies and browser
        run: |
          bun install --frozen-lockfile
          npm install --prefix /tmp/nomotecnia-ui --no-audit --no-fund playwright@1.56.1 wrangler@4
          /tmp/nomotecnia-ui/node_modules/.bin/playwright install --with-deps chromium
      - name: Typecheck and all unit tests
        run: |
          bunx tsc --noEmit
          bun run test
      - name: Build operational PDF mode using staging database only
        env:
          VITE_NOMOTECNIA_STAGING: "true"
          VITE_ENABLE_DOCUMENT_PDF_LAB: "false"
          STAGING_DOCUMENT_MODE: "local"
          VITE_SUPABASE_URL: "https://vknvadzsjuixcuwegxto.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          bun run build
          node scripts/prepare-full-staging.mjs
      - name: Browser regression with four disposable users and synthetic PDFs
        env:
          STAGING_DOCUMENT_MODE: "local"
          STAGING_DOCUMENT_EXTENSIONS: "true"
          STAGING_SUPABASE_URL: "https://vknvadzsjuixcuwegxto.supabase.co"
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
        run: node scripts/verify-staging-ui.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: local-document-synthetic-ui
          path: ui-test-results/
          retention-days: 3

