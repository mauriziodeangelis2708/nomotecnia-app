name: Document intelligence draft checks
on:
  pull_request:
    paths:
      - "src/lib/document-prefill-demo*"
      - "src/lib/local-pdf-reader*"
      - "src/components/DocumentPrefillSandbox.tsx"
      - "src/routes/_authenticated/assessment.$id.tsx"
      - "package.json"
      - "scripts/verify-synthetic-pdf.mjs"
      - "bun.lock"
      - ".github/workflows/document-intelligence-check.yml"
concurrency:
  group: document-intelligence-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install packages (draft dependency validation)
        run: bun install
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint new document-reading modules
        run: bunx eslint src/lib/document-prefill-demo.ts src/lib/document-prefill-demo.test.ts src/lib/local-pdf-reader.ts src/lib/local-pdf-reader.test.ts src/components/DocumentPrefillSandbox.tsx
      - name: Unit tests
        run: bun run test
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Real PDF.js roundtrip (synthetic document only)
        run: node scripts/verify-synthetic-pdf.mjs
      - name: Production build
        run: bun run build
      - name: Frozen lockfile validation
        run: |
          git diff --exit-code -- bun.lock
          bun install --frozen-lockfile

