name: Document intelligence draft checks
on:
  pull_request:
    paths:
      - "src/lib/document-prefill-demo*"
      - "src/lib/local-pdf-reader*"
      - "src/components/DocumentPrefillSandbox.tsx"
      - "src/routes/_authenticated/assessment.$id.tsx"
      - "package.json"
      - "scripts/verify-synthetic-pdf.mjs"
      - "bun.lock"
      - ".github/workflows/document-intelligence-check.yml"
  push:
    branches:
      - feature/document-intelligence-sandbox-20261015
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install packages (draft dependency validation)
        run: bun install
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint new document-reading modules
        run: bunx eslint --fix src/lib/document-prefill-demo.ts src/lib/document-prefill-demo.test.ts src/lib/local-pdf-reader.ts src/lib/local-pdf-reader.test.ts src/components/DocumentPrefillSandbox.tsx
      - name: Unit tests
        run: bun run test
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Real PDF.js roundtrip (synthetic document only)
        run: node scripts/verify-synthetic-pdf.mjs
      - name: Production build
        run: bun run build
      - name: Frozen lockfile validation
        run: |
          git diff --exit-code -- bun.lock
          bun install --frozen-lockfile

  align-draft-lockfile:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/document-intelligence-sandbox-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Generate dependency lock from validated manifest
        run: bun install
      - name: Format new feature files on isolated branch
        run: bunx prettier --write src/lib/document-prefill-demo.ts src/lib/document-prefill-demo.test.ts src/lib/local-pdf-reader.ts src/lib/local-pdf-reader.test.ts src/components/DocumentPrefillSandbox.tsx
      - name: Commit formatted feature files and dependency lockfile
        run: |
          if git diff --quiet -- bun.lock src/lib/document-prefill-demo.ts src/lib/document-prefill-demo.test.ts src/lib/local-pdf-reader.ts src/lib/local-pdf-reader.test.ts src/components/DocumentPrefillSandbox.tsx; then
            echo "Lockfile already aligned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bun.lock src/lib/document-prefill-demo.ts src/lib/document-prefill-demo.test.ts src/lib/local-pdf-reader.ts src/lib/local-pdf-reader.test.ts src/components/DocumentPrefillSandbox.tsx
          git diff --cached --stat
          git commit -m "chore: format document intelligence prototype and align dependency lock"
          git push origin HEAD:refs/heads/feature/document-intelligence-sandbox-20261015
